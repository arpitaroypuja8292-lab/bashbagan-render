name: render
on: workflow_dispatch

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Unzip project
        run: unzip -q bashbagan.zip

      - name: Install packages
        working-directory: bashbagan
        run: npm install

      - name: Install Chrome libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 \
            libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 \
            libgbm-dev libcups2 libatk-bridge2.0-0

      - name: Render video
        working-directory: bashbagan
        run: npx remotion render src/index.ts Bashbagan out/bashbagan.mp4 --codec=h264 --crf=22 --concurrency=2

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: bashbagan/out/bashbagan.mp4
